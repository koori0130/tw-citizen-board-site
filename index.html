<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雙北小市民看板</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --paper:#fff8e6;--paper2:#f6e9c4;--card:#fffefa;--ink:#2a2620;--mut:#7a725d;
  --red:#e2503b;--yellow:#ffd966;--line:#2a2620;--shadow:3px 3px 0 rgba(42,38,32,.9);
  --c-drink:#3b6fc4;--c-cvs:#2e8b62;--c-food:#c0701f;--c-sweet:#cf5d97;--gray:#e8e4d6;--gray-line:#bdb7a3;
  --font:"Chalkboard SE","Marker Felt","ui-rounded","Hiragino Maru Gothic ProN","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media(prefers-color-scheme:dark){:root{--c-drink:#6b9cf0;--c-cvs:#4cc08b;--c-food:#e39a55;--c-sweet:#ef86b9;--gray:#39446a;--gray-line:#56628d;--paper:#1c2540;--paper2:#26325a;--card:#2b3760;--ink:#fff3cf;--mut:#c4bd9f;--line:#fff3cf;--shadow:3px 3px 0 #0c1226}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font);
  background-image:radial-gradient(var(--paper2) 1.5px,transparent 2px);background-size:24px 24px}
.zig{height:16px;background-color:var(--yellow);background-size:16px 16px;border-bottom:2.5px solid var(--line);
  background-image:linear-gradient(135deg,var(--line) 25%,transparent 25%),linear-gradient(225deg,var(--line) 25%,transparent 25%);background-position:-8px 0,-8px 0;background-repeat:repeat-x}
main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.house{width:72px;height:72px;flex:none}
.avatar{width:72px;height:72px;flex:none;border:2.5px solid var(--line);border-radius:50%;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
header .ttl{flex:1 1 0;min-width:0}
h1{margin:0;font-size:clamp(24px,4.5vw,34px);line-height:1.1;letter-spacing:1px}
.sub{color:var(--mut);font-size:12px;margin:2px 0 0}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:4px 12px;font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.bubble::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:11px solid var(--line);border-left:0}
.bubble::after{content:"";position:absolute;left:-8px;top:50%;margin-top:-5px;border:5px solid transparent;border-right:8px solid var(--card);border-left:0}
.tabs{display:flex;gap:10px;margin:4px 0 14px;position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--paper) 80%,transparent)}
.tab{flex:1;max-width:200px;display:flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:16px;padding:8px 12px;border-radius:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s}
.tab:hover{transform:translate(-1px,-1px)}
.tab[aria-selected=true]{background:var(--yellow);color:#2a2620;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.tab svg{width:32px;height:32px}
.layout{display:block}
@media(min-width:900px){.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}.side{position:sticky;top:70px}}
@media(max-width:899px){#mascot{display:none}}
.box{background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:8px 12px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.ico{font-size:18px;width:24px;text-align:center}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:2px 12px;border-radius:999px;cursor:pointer;min-height:34px;min-width:40px}
.chip.iconly{padding:0;width:68px;height:60px;display:inline-flex;align-items:center;justify-content:center}
.ic{display:block;width:46px;height:46px}.ic svg{display:block;width:100%;height:100%}
.chip .ci{display:inline-block;width:32px;height:32px;vertical-align:middle;margin-right:6px}.chip .ci svg{display:block;width:100%;height:100%}
.chip:hover{background:var(--paper2)}
.chip[aria-pressed=true]{background:var(--yellow);color:#2a2620;box-shadow:2px 2px 0 var(--line)}
.chip[data-k=drink]{--ck:var(--c-drink)}.chip[data-k=cvs]{--ck:var(--c-cvs)}.chip[data-k=food]{--ck:var(--c-food)}.chip[data-k=sweet]{--ck:var(--c-sweet)}
.chip[data-k]{border:2.5px solid var(--gray-line);background:var(--gray);min-height:44px;color:var(--mut);transition:transform .12s}
.chip[data-k] svg{filter:grayscale(1);opacity:.5}
.chip[data-k][aria-pressed=true]{background:color-mix(in srgb,var(--ck) 36%,#fff);color:#2a2620;border:3px solid var(--ck);box-shadow:3px 3px 0 var(--line);transform:translateY(-2px)}
.chip[data-k][aria-pressed=true] svg{filter:none;opacity:1}
.chip:disabled{opacity:.4;cursor:not-allowed}
input[type=search],input[type=date],select{font:inherit;font-size:14px;padding:4px 10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:36px}
input[type=search]{flex:1;min-width:110px}
:focus-visible{outline:3px solid var(--c-drink);outline-offset:2px}
.count{display:inline-block;font-weight:800;margin:0 0 10px;background:var(--yellow);color:#2a2620;border:2.5px solid var(--line);border-radius:999px;padding:1px 14px;box-shadow:2px 2px 0 var(--line)}
.card{background:var(--card);border:2.5px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px 10px;margin-bottom:14px;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translate(-1px,-1px)}
.card.ended{opacity:.5}
.card.k-drink{border-left:8px solid var(--c-drink)}.card.k-cvs{border-left:8px solid var(--c-cvs)}.card.k-food{border-left:8px solid var(--c-food)}.card.k-sweet{border-left:8px solid var(--c-sweet)}
.chead{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;flex:none;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#fff;overflow:hidden;background:#fff}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.chead .nm{flex:1;min-width:0;font-weight:900;font-size:16px;line-height:1.25}
.info{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;margin-left:2px;padding:0;border:1.5px solid var(--mut);border-radius:50%;background:none;color:var(--mut);font:700 11px/1 var(--font);cursor:pointer;opacity:.75}
.info:hover{opacity:1;color:var(--ink);border-color:var(--ink)}
.tags{display:flex;gap:5px;align-items:center;flex:none}
.tag{display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;min-width:26px;height:24px;padding:0 8px;border:1.5px solid currentColor;border-radius:999px;white-space:nowrap}
.tag.k{flex:none;width:52px;height:52px;padding:5px;border:2.5px solid currentColor;border-radius:14px}.tag.k svg{display:block;width:100%;height:100%}
.t-drink{color:var(--c-drink);background:color-mix(in srgb,var(--c-drink) 30%,var(--card))}
.t-cvs{color:var(--c-cvs);background:color-mix(in srgb,var(--c-cvs) 30%,var(--card))}
.t-food{color:var(--c-food);background:color-mix(in srgb,var(--c-food) 30%,var(--card))}
.t-sweet{color:var(--c-sweet);background:color-mix(in srgb,var(--c-sweet) 30%,var(--card))}
.t-good{color:#2a2620;background:var(--yellow);border-color:var(--line)}
.t-new{color:var(--mut)}.t-warn{color:var(--mut);border-style:dashed}
.t-hot{color:#fff;background:var(--red);border-color:var(--red)}
.t-end{color:#fff;background:#8d887a;border-color:#8d887a}
.dealtxt{font-size:15px;margin:6px 0 2px}
.meta{color:var(--mut);font-size:12.5px}
.cardfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.src-btn,.maps{font:inherit;font-weight:800;font-size:13px;padding:2px 12px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none}
.src-btn:hover,.maps:hover{background:var(--yellow);color:#2a2620}
.maps{margin-left:auto}
a{color:var(--c-drink);font-weight:700}
.social{margin-top:8px;padding:6px 10px;border:2px dashed var(--line);border-radius:12px;font-size:13px}
.social button{font:inherit;font-weight:700;margin-left:8px;padding:1px 10px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.embed{margin-top:8px;max-width:540px}
.empty{text-align:center;padding:24px 12px;font-weight:700;color:var(--mut)}
.empty svg{width:90px;height:90px;display:block;margin:0 auto 8px}
.empty .pic{width:140px;margin:0 auto 8px;border:2.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.empty .pic img{display:block;width:100%}
#panel{background:var(--card);border:2.5px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:0 0 12px;margin:4px 0 14px;overflow:hidden;animation:pop .18s ease-out}
#panel .ph{background:var(--yellow);color:#2a2620;border-bottom:2.5px solid var(--line);padding:6px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
#panel .pb{padding:10px 16px 0}
#panel h2{font-size:17px;margin:0 0 4px;line-height:1.3}
.pclose{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;padding:0 10px;min-height:28px}
.psrc{border-top:2px dashed var(--line);margin-top:10px;padding-top:8px}
.ok{color:var(--c-cvs);font-weight:800}.todo{color:var(--red);font-weight:800}
#mascot{text-align:center}
#mascot .frame{overflow:hidden;border:2.5px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
#mascot .frame:hover{transform:rotate(-1deg) scale(1.02)}
#mascot .crop{position:relative;width:100%;overflow:hidden}#mascot .crop img{display:block;width:100%}
#mascot .say{display:inline-block;margin-top:10px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:3px 14px;font-weight:800;font-size:14px;box-shadow:2px 2px 0 var(--line)}
.refresh{font:inherit;font-weight:800;font-size:12px;margin-left:8px;padding:1px 10px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer;vertical-align:1px}
.refresh:hover{background:var(--yellow);color:#2a2620}.refresh.stale{border-color:var(--red);color:var(--red)}
dialog{border:2.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);padding:0;max-width:440px;width:calc(100% - 32px);font:inherit}
dialog::backdrop{background:rgba(42,38,32,.45)}
dialog .dh{background:var(--yellow);color:#2a2620;border-bottom:2.5px solid var(--line);padding:8px 14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
dialog .db{padding:12px 16px 14px;font-size:14px}
dialog .db p{margin:6px 0}
dialog textarea{width:100%;font:inherit;font-size:13px;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--paper);color:var(--ink);resize:none}
dialog .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
dialog .btns button{font:inherit;font-weight:800;font-size:14px;padding:4px 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
dialog .btns button.main{background:var(--yellow);color:#2a2620}
footer{color:var(--mut);font-size:11.5px;text-align:center;margin-top:22px}
.totop{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);background:var(--yellow);color:#2a2620;font-weight:900;font-size:18px;cursor:pointer;box-shadow:var(--shadow);display:none;z-index:6}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
[hidden]{display:none!important}
@media(max-width:520px){.house,.avatar{width:54px;height:54px}header{gap:10px}.bubble{flex:1 0 100%;margin-left:12px}.tab{font-size:15px;padding:7px 6px}}
</style>
</head>

function chips(box,values,key,onChange,disabled){
  box.replaceChildren();
  values.forEach(v=>{
    const only=ICONLY.has(v);
    const b=el('button','chip'+(only?' iconly':''));
    if(only)b.append(svgEl(v,'ic'));
    else{if(ICONSVG[v])b.append(svgEl(v,'ci'));b.append(document.createTextNode(SORTLBL[v]||v))}
    b.type='button';b.title=v;b.setAttribute('aria-label',v);b.setAttribute('aria-pressed',String(st[key]===v));
    if(KIND[v])b.dataset.k=KIND[v];
    if(disabled&&disabled(v)){b.disabled=true}
    b.onclick=()=>{st[key]=v;chips(box,values,key,onChange,disabled);onChange()};box.append(b)});
}
function fillSelect(sel,values,key){
  sel.replaceChildren();
  [['',key==='sDist'?'全部區':'全部品牌'],...values.map(v=>[v,v])].forEach(([v,t])=>{const o=el('option',null,t);o.value=v;sel.append(o)});
  sel.value=st[key];
}

/* ---- brand badge: optional logo image (assets/logos/<brand>.png) else a colored initial ---- */
const BADGE=['#3b6fc4','#2e8b62','#c0701f','#cf5d97','#7a5cc2','#2a9aa8','#b5485d'];
function logoFor(name){
  const first=name.split(/[\s（(]/)[0];
  const src=LOGOS[name]||LOGOS[first];
  const d=el('div','logo');
  if(src){const i=el('img');i.src=src;i.alt='';d.append(i);return d}
  let h=0;for(const ch of first)h=(h*31+ch.codePointAt(0))>>>0;
  d.style.background=BADGE[h%BADGE.length];
  const m=first.match(/^[A-Za-z0-9]/)?first.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase():[...first][0];
  d.textContent=m||'?';d.setAttribute('aria-hidden','true');return d;
}
function head(name,tags){
  const h=el('div','chead');h.append(logoFor(name),el('div','nm',name),tags);return h;
}

/* ---- source panel ---- */
let panelFor=null;
function srcBtn(kind,x){const b=el('button','src-btn','🔗 來源');b.type='button';b.title='來源';b.setAttribute('aria-label','來源');b.onclick=()=>openPanel(kind,x);return b}
function closePanel(){const pn=$('panel');pn.hidden=true;pn.replaceChildren();panelFor=null;showMascot()}
function openPanel(kind,x){
  const pn=$('panel');pn.replaceChildren();panelFor=x;
  const ph=el('div','ph');ph.append(el('span',null,'🔗 出處'));
  const cl=el('button','pclose','✕');cl.type='button';cl.title='關閉';cl.setAttribute('aria-label','關閉來源面板');cl.onclick=closePanel;ph.append(cl);
  const pb=el('div','pb');
  pb.append(el('h2',null,kind==='deal'?`${x.brand}　${x.deal}`:x.name));
  if(kind==='deal'){
    pb.append(el('div','meta',`${x.start} ～ ${x.end}`+(x.note?`｜${x.note}`:'')));
  }else{
    pb.append(el('div','meta',`${x.city}${x.district}｜${x.opened} 開幕｜${x.address}`));
    if(x.rating!=null)pb.append(el('div','meta',`⭐ ${Number(x.rating).toFixed(1)}（${x.review_count}）`));
  }
  pb.append(el('div',x.verified?'ok':'todo',x.verified?'✔ 已查證':'待確認：來源尚未完整對照'));
  x.sources.forEach(s=>{
    const d=el('div','psrc');d.append(el('div',null,s.title),el('div','meta',`${s.publisher}｜${s.date||'日期未載明'}`));
    const l=el('div','links');l.append(link(s.url,'開啟原文 ↗'));d.append(l);pb.append(d);
  });
  pn.append(ph,pb);pn.hidden=false;showMascot();
  if(!matchMedia('(min-width:900px)').matches)pn.scrollIntoView({behavior:'smooth',block:'nearest'});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panelFor)closePanel()});

/* ---- mascot (optional decoration images in assets/art) ---- */
const MASCOT=[{k:'heart',w:335,h:412,top:145,say:'愛你喲！'},{k:'hug',w:335,h:400,top:150,say:'抱一個～'},
  {k:'flowers',w:335,h:370,top:150,say:'送你花花'},{k:'sit',w:335,h:200,top:280,say:'歇口氣～'}].filter(m=>ART[m.k]);
let mi=0;
function showMascot(){
  const m=$('mascot');
  if(!MASCOT.length||!$('panel').hidden){m.hidden=true;return}
  const c=MASCOT[mi%MASCOT.length];m.replaceChildren();
  const fr=el('div','frame');fr.title='點一下換一張';fr.tabIndex=0;fr.setAttribute('role','button');
  const cr=el('div','crop');cr.style.aspectRatio=c.w+'/'+c.h;
  const im=el('img');im.src=ART[c.k];im.alt='';im.style.marginTop='-'+(c.top/c.w*100)+'%';cr.append(im);fr.append(cr);
  const next=()=>{mi++;showMascot()};fr.onclick=next;fr.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}};
  m.append(fr,el('div','say',c.say));m.hidden=false;
}
if(ART.wave){const h=document.querySelector('.house');const a=el('div','avatar'),i=el('img');i.src=ART.wave;i.alt='';a.append(i);h.replaceWith(a)}
if(MASCOT.length||ART.wave||ART.picnic)$('credit').textContent='Snoopy、Woodstock © Peanuts Worldwide LLC · 僅供內部朋友使用';

/* ---- deals ---- */
function dealDays(){
  if(st.dMode==='today')return [BASE];
  if(st.dMode==='tomorrow')return [addDays(BASE,1)];
  if(st.dMode==='weekend'){const dow=new Date(BASE+'T00:00:00').getDay();const sat=dow===0?addDays(BASE,-1):addDays(BASE,(6-dow+7)%7);return [sat,addDays(sat,1)]}
  if(st.dMode==='pick'&&st.dPick)return [st.dPick];
  return null;
}
function renderDeals(){
  const days=dealDays(),q=st.dq.trim().toLowerCase();
  const d=DATA.deals.filter(x=>(st.dCat==='全部'||x.category===st.dCat)&&(!st.dBrand||x.brand===st.dBrand)
    &&(!days||days.some(t=>x.start<=t&&t<=x.end))
    &&(!q||(x.brand+' '+x.deal+' '+x.note).toLowerCase().includes(q)))
    .sort((a,b)=>((a.end<BASE)-(b.end<BASE))||a.end.localeCompare(b.end));
  const label={all:'',today:' · 今天',tomorrow:' · 明天',weekend:' · 週末',pick:st.dPick?` · ${md(st.dPick)}`:''}[st.dMode];
  $('dCount').textContent=`${d.length} 筆${label}`;
  const box=$('dList');box.replaceChildren();
  if(!d.length)box.append(emptyBox('沒有符合的優惠'));
  d.forEach(x=>{
    const c=el('div','card k-'+KIND[x.category]+(x.end<BASE?' ended':''));
    const tags=el('div','tags');
    const left=diffDays(BASE,x.end);
    if(x.end<BASE)tags.append(el('span','tag t-end','已結束'));
    else if(left===0)tags.append(el('span','tag t-hot','⏰ 今天'));
    else if(left<=3)tags.append(el('span','tag t-hot',`⏰ ${left} 天`));
    tags.append(kindTag(x.category));
    c.append(head(x.brand,tags),el('div','dealtxt',x.deal),el('div','meta',`📅 ${md(x.start)} – ${md(x.end)}`+(x.note?`　${x.note}`:'')));
    const f=el('div','cardfoot');f.append(srcBtn('deal',x));if(!x.verified)f.append(infoEl(()=>openPanel('deal',x)));c.append(f);box.append(c);
  });
}

/* ---- shops ---- */
function embed(box,s){
  const wrap=el('div','embed');box.after(wrap);
  const bq=el('blockquote');
  if(s.platform==='ig'){bq.className='instagram-media';bq.setAttribute('data-instgrm-permalink',s.url);bq.setAttribute('data-instgrm-version','14')}
  else{bq.className='text-post-media';bq.setAttribute('data-text-post-permalink',s.url);bq.setAttribute('data-text-post-version','0')}
  wrap.append(bq);
  const src=s.platform==='ig'?'https://www.instagram.com/embed.js':'https://www.threads.net/embed.js';
  const fail=()=>{wrap.remove();const m=el('div','meta','預覽無法載入，請用上方連結開啟貼文。');box.after(m)};
  const sc=document.createElement('script');sc.async=true;sc.src=src;sc.onerror=fail;
  sc.onload=()=>{if(s.platform==='ig'&&window.instgrm)window.instgrm.Embeds.process();
    let n=0;const t=setInterval(()=>{if(wrap.querySelector('iframe')){clearInterval(t)}else if(++n>16){clearInterval(t);fail()}},500)};
  document.head.append(sc);
}
function mapsUrl(x){
  const short=x.name.replace(/（.*?）|\(.*?\)/g,'').trim();
  const addr=(x.address||'').replace(/（.*?）|\(.*?\)/g,'').trim();
  const dest=/\d+\s*號/.test(addr)?`${short} ${addr}`:`${short} ${x.city==='台北'?'台北市':'新北市'}${x.district}`;
  return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest);
}
function renderShops(){
  const q=st.sq.trim().toLowerCase();
  const p=DATA.places.filter(x=>(st.sType==='全部'||x.type===st.sType)&&(st.sCity==='全部'||x.city===st.sCity)
    &&(!st.sDist||x.district===st.sDist)&&(!q||(x.name+' '+x.district+' '+x.highlight).toLowerCase().includes(q)))
    .sort((a,b)=>st.sSort==='評分高到低'?((b.rating??-1)-(a.rating??-1))||b.opened.localeCompare(a.opened):b.opened.localeCompare(a.opened));
  const box=$('sList');box.replaceChildren();
  if(!DATA.places.length){$('sCount').textContent='';box.append(emptyBox('查證中，暫無資料'));return}
  $('sCount').textContent=`${p.length} 間`;
  if(!p.length)box.append(emptyBox('沒有符合的店家'));
  p.forEach(x=>{
    const c=el('div','card k-'+KIND[x.type]),tags=el('div','tags');
    if(x.label!=='待確認'){
      const lab=x.label==='優質'?['tag t-good','⭐ 優質']:['tag t-new','🌱 評價尚少'];
      const lt=el('span',lab[0],lab[1]);lt.title=x.label;tags.append(lt);
    }
    tags.append(kindTag(x.type));
    const warn=!x.verified||x.label==='待確認';
    c.append(head(x.name,tags),el('div','meta',`📍 ${x.city}${x.district}　🎉 ${md(x.opened)}　${x.address}`));
    if(x.highlight)c.append(el('div','dealtxt',x.highlight));
    if(x.rating!=null)c.append(el('div','meta',`⭐ ${Number(x.rating).toFixed(1)}（${x.review_count}）`));
    const f=el('div','cardfoot');f.append(srcBtn('shop',x));if(warn)f.append(infoEl(()=>openPanel('shop',x)));const mp=link(mapsUrl(x),'📍 導航');mp.className='maps';mp.title='Google 地圖導航';f.append(mp);c.append(f);
    if(x.social){
      const s=el('div','social');s.append(el('span',null,x.social.platform==='ig'?'Instagram：':'Threads：'),
        link(x.social.url,x.social.embeddable?'開啟貼文':'店家帳號'));
      if(x.social.embeddable){const b=el('button',null,'展開預覽');b.type='button';
        b.onclick=()=>{b.remove();embed(s,x.social)};s.append(b)}
      c.append(s);
    }
    box.append(c);
  });
}
function syncDistricts(){
  const ds=uniq(DATA.places.filter(x=>st.sCity==='全部'||x.city===st.sCity).map(x=>x.district));
  if(!ds.includes(st.sDist))st.sDist='';fillSelect($('sDist'),ds,'sDist');
}
function syncBrands(){
  const bs=uniq(DATA.deals.filter(x=>st.dCat==='全部'||x.category===st.dCat).map(x=>x.brand));
  if(!bs.includes(st.dBrand))st.dBrand='';fillSelect($('dBrand'),bs,'dBrand');
}

/* ---- wiring ---- */
const AGE=diffDays(M.generated,REAL_TODAY);
$('sub').textContent=`📅 資料 ${md(M.generated)}（${AGE<=0?'今天':AGE+' 天前'}）`;
$('sub').title=`優惠 ${M.deal_start}～${M.deal_end}｜新店 ${M.shop_start}～${M.shop_end}`;
const rb=el('button','refresh'+(AGE>=3?' stale':''),'🔄 更新');rb.type='button';rb.title='查看資料時間與更新方式';$('sub').append(rb);
const PROMPT='請更新雙北小市民看板的資料：重新查證手搖飲／超商優惠與最近 30 天新開幕店家，更新 deals.json 與 places.json，並重新產生 tw-citizen-board.html。';
rb.onclick=()=>{
  const d=$('dlg');d.replaceChildren();
  const dh=el('div','dh');dh.append(el('span',null,'🔄 資料更新'));const x=el('button','pclose','✕');x.type='button';x.setAttribute('aria-label','關閉');x.onclick=()=>d.close();dh.append(x);
  const db=el('div','db');
  db.append(el('p',null,`📅 資料抓取日：${M.generated}（${AGE<=0?'今天':AGE+' 天前'}）`));
  if(M.built_at)db.append(el('p','meta',`網頁產生時間：${M.built_at.replace('T',' ')}`));
  if(AGE>=3)db.append(el('p','todo',`資料已經 ${AGE} 天沒有更新，優惠可能已過期或有新的檔期。`));
  db.append(el('p',null,'這個網頁是離線快照，本身不能上網抓資料。要更新時，把下面這段貼給 Claude：'));
  const ta=el('textarea');ta.readOnly=true;ta.rows=4;ta.value=PROMPT;db.append(ta);
  const bt=el('div','btns'),cp=el('button','main','📋 複製指令');cp.type='button';
  cp.onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(PROMPT);ok=true}catch(e){ta.select();try{ok=document.execCommand('copy')}catch(e2){}}cp.textContent=ok?'✔ 已複製':'請手動複製上面文字'};
  const rl=el('button',null,'🔃 重新載入頁面');rl.type='button';rl.onclick=()=>location.reload();
  bt.append(cp,rl);db.append(bt,el('p','meta','Claude 更新完成後，按「重新載入頁面」就會看到新資料。'));
  d.append(dh,db);d.showModal();
};
const hot=DATA.deals.filter(x=>x.end>=BASE&&diffDays(BASE,x.end)<=3).length;
$('hello').textContent=hot?`⏰ ${hot} 個快結束！`:'今天想喝什麼？';
chips($('dCat'),['全部','手搖飲','超商'],'dCat',()=>{syncBrands();renderDeals()});
const QUICK=[['all','全部'],['today','今天'],['tomorrow','明天'],['weekend','週末']];
function drawQuick(){
  const box=$('dQuick');box.replaceChildren();
  QUICK.forEach(([k,t])=>{
    const b=el('button','chip',t);b.type='button';b.setAttribute('aria-pressed',String(st.dMode===k));
    if(k!=='all'&&!todayOK)b.disabled=true,b.title='今天不在這份資料的日期範圍內';
    b.onclick=()=>{st.dMode=k;st.dPick='';$('dDate').value='';drawQuick();renderDeals()};box.append(b);
  });
}
drawQuick();syncBrands();
$('dBrand').onchange=e=>{st.dBrand=e.target.value;renderDeals()};
$('dSearch').oninput=e=>{st.dq=e.target.value;renderDeals()};
$('dDate').min=M.deal_start;$('dDate').max=M.deal_end;
$('dDate').onchange=e=>{st.dPick=e.target.value;st.dMode=e.target.value?'pick':'all';drawQuick();renderDeals()};
chips($('sType'),['全部','餐廳','飲料','甜點'],'sType',renderShops);
chips($('sCity'),['全部','台北','新北'],'sCity',()=>{syncDistricts();renderShops()});
chips($('sSort'),['最新開幕','評分高到低'],'sSort',renderShops);
$('sDist').onchange=e=>{st.sDist=e.target.value;renderShops()};
$('sSearch').oninput=e=>{st.sq=e.target.value;renderShops()};
function tab(which){
  closePanel();
  $('deals').hidden=which!=='deals';$('shops').hidden=which!=='shops';
  $('tab-deals').setAttribute('aria-selected',String(which==='deals'));
  $('tab-shops').setAttribute('aria-selected',String(which==='shops'));
  try{history.replaceState(null,'','#'+which)}catch(e){}
}
$('tab-deals').onclick=()=>tab('deals');$('tab-shops').onclick=()=>tab('shops');
const tt=$('totop');tt.onclick=()=>scrollTo({top:0});
addEventListener('scroll',()=>{tt.style.display=scrollY>500?'block':'none'},{passive:true});
syncDistricts();renderDeals();renderShops();showMascot();
if(location.hash==='#shops')tab('shops');
</script>
